<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인창고 공통수학2 - 원의 방정식 객관식 퀴즈</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .quiz-container { max-width: 600px; margin: 0 auto; }
        .quiz-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .level { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 15px; color: white; }
        .easy { background-color: #27ae60; }
        .medium { background-color: #f39c12; }
        .hard { background-color: #e74c3c; }
        .question { font-size: 16px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
        .options { margin-bottom: 15px; }
        .option { margin-bottom: 8px; padding: 10px 15px; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .option:hover { background: #e9ecef; }
        .option.selected { background: #eef2f5; border-color: #3498db; font-weight: bold; color: #2980b9; }
        .answer-box { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }
        .result-msg { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
        .hint { font-size: 13px; color: #7f8c8d; font-weight: normal; margin-top: 8px; line-height: 1.4; }
        button.check-btn { background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; font-weight: bold; }
        button.check-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>🎯 원의 방정식 객관식 20제</h1>
    <p style="text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 30px;">
        알맞은 보기를 선택하고 정답을 확인해보세요!
    </p>

    <div class="quiz-container" id="quiz-list"></div>

    <script>
        const quizzes = [
            { level: 'easy', levelText: '난이도 하', q: "원의 정의는 '평면 위의 한 정점으로부터 [ ? ] 거리에 있는 점들의 집합'이다. 빈칸에 알맞은 말은?", opts: ["다른", "무한한", "일정한(같은)", "0인", "비례하는"], ans: 3, h: "요점정리 1번 '원의 정의'를 떠올려보세요." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (2, -3)이고 반지름이 4인 원의 방정식은?", opts: ["(x + 2)² + (y - 3)² = 4", "(x - 2)² + (y + 3)² = 4", "(x - 2)² + (y + 3)² = 16", "(x + 2)² + (y - 3)² = 16", "(x - 2)² + (y - 3)² = 16"], ans: 3, h: "중심이 (a, b)이면 (x - a)² + (y - b)² = r² 이 됩니다." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 원점 (0, 0)이고 반지름이 5인 원의 방정식은?", opts: ["x² + y² = 5", "x² + y² = 10", "x² + y² = 25", "x² - y² = 25", "x + y = 25"], ans: 3, h: "원점 중심이면 x² + y² = r² 형태입니다." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² + 4x - 2y - 4 = 0 의 중심의 좌표는?", opts: ["(2, -1)", "(-2, 1)", "(4, -2)", "(-4, 2)", "(-2, -1)"], ans: 2, h: "x는 x끼리, y는 y끼리 완전제곱식으로 묶어보세요." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² - 6x + 8y = 0 의 반지름의 길이는?", opts: ["3", "4", "5", "16", "25"], ans: 3, h: "(x - 3)² + (y + 4)² = 25 로 묶어보세요." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (3, 4)이고 x축에 접하는 원의 방정식은?", opts: ["(x - 3)² + (y - 4)² = 3", "(x - 3)² + (y - 4)² = 4", "(x - 3)² + (y - 4)² = 9", "(x - 3)² + (y - 4)² = 16", "(x - 3)² + (y - 4)² = 25"], ans: 4, h: "x축에 접하면 반지름 r = |y좌표| 가 됩니다." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (-2, 5)이고 y축에 접하는 원의 반지름의 길이는?", opts: ["2", "4", "5", "10", "25"], ans: 1, h: "y축에 접하면 반지름 r = |x좌표| 가 됩니다." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (3, 3)이고 x축과 y축에 동시에 접하는 원의 방정식은?", opts: ["(x - 3)² + (y - 3)² = 3", "(x + 3)² + (y + 3)² = 9", "(x - 3)² + (y - 3)² = 9", "(x - 3)² + (y - 3)² = 6", "(x - 3)² + (y - 3)² = 18"], ans: 3, h: "중심이 제1사분면이므로 반지름은 3입니다." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² = 25 위의 점 (3, 4)에서의 접선의 방정식은?", opts: ["4x + 3y = 25", "3x + 4y = 25", "3x - 4y = 25", "4x - 3y = 25", "3x + 4y = 5"], ans: 2, h: "원 위의 점 공식 x₁x + y₁y = r² 을 바로 적용하세요." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² = 9 에 접하고 기울기가 2인 접선의 y절편은?", opts: ["± 2√5", "± 3√5", "± 4√5", "± 5", "± 9"], ans: 2, h: "기울기 공식 y = mx ± r√(m² + 1) 을 적용하세요." },
            { level: 'easy', levelText: '난이도 하', q: "원의 중심과 직선 사이 거리를 d, 반지름을 r이라 할 때, 원과 직선이 한 점에서 만날(접할) 조건은?", opts: ["d > r", "d < r", "d = r", "d = 0", "r = 0"], ans: 3, h: "접한다는 것은 중심부터 직선까지의 거리가 반지름과 정확히 같다는 뜻입니다." },
            { level: 'easy', levelText: '난이도 하', q: "d < r 일 때, 원과 직선의 위치 관계로 알맞은 것은?", opts: ["한 점에서 만난다.", "두 점에서 만난다.", "만나지 않는다.", "일치한다.", "알 수 없다."], ans: 2, h: "거리가 반지름보다 짧으면 선이 원을 뚫고 지나갑니다." },
            { level: 'easy', levelText: '난이도 하', q: "원과 직선의 위치 관계에서 판별식 D < 0 일 때, 두 도형은 몇 개의 점에서 만나는가?", opts: ["0개 (만나지 않는다.)", "1개", "2개", "3개", "무수히 많다."], ans: 1, h: "실근이 없다는 것은 교점이 없다는 뜻입니다." },
            { level: 'easy', levelText: '난이도 하', q: "일반형 x² + y² + Ax + By + C = 0 이 원을 나타내기 위한 조건은?", opts: ["A² + B² - 4C < 0", "A² + B² - 4C = 0", "A² + B² - 4C > 0", "A² + B² + 4C > 0", "A² + B² > 0"], ans: 3, h: "우변의 (반지름)² 에 해당하는 부분이 0보다 커야 합니다." },
            { level: 'easy', levelText: '난이도 하', q: "원 (x - 1)² + (y - 2)² = 9 와 중심이 같고, 원점 (0, 0)을 지나는 원의 방정식은?", opts: ["(x - 1)² + (y - 2)² = 1", "(x - 1)² + (y - 2)² = 2", "(x - 1)² + (y - 2)² = 3", "(x - 1)² + (y - 2)² = 4", "(x - 1)² + (y - 2)² = 5"], ans: 5, h: "중심 (1, 2)와 (0, 0) 사이의 거리의 제곱이 새로운 원의 r² 이 됩니다." },
            { level: 'medium', levelText: '난이도 중', q: "방정식 x² + y² + 2x - 4y + k = 0 이 원을 나타내기 위한 상수 k의 값의 범위는?", opts: ["k < 5", "k > 5", "k < 4", "k > 4", "k < 20"], ans: 1, h: "A² + B² - 4C > 0 에 A=2, B=-4, C=k 를 대입해보세요." },
            { level: 'medium', levelText: '난이도 중', q: "원 (x - 1)² + (y - 2)² = 5 와 직선 y = 2x + k 가 접할 때, 양수 k의 값은?", opts: ["1", "2", "3", "4", "5"], ans: 5, h: "중심 (1, 2)와 2x - y + k = 0 사이의 거리가 반경(√5)과 같아야 합니다." },
            { level: 'medium', levelText: '난이도 중', q: "점 (-1, 2)를 지나고 x축과 y축에 동시에 접하는 두 원의 반지름의 합은?", opts: ["3", "4", "5", "6", "7"], ans: 4, h: "제2사분면이므로 중심을 (-r, r)로 두고 (-1+r)² + (2-r)² = r² 을 풀어보세요." },
            { level: 'hard', levelText: '난이도 상', q: "원 x² + y² = 4 와 직선 y = x + k 가 서로 다른 두 점에서 만나도록 하는 정수 k의 개수는?", opts: ["3개", "4개", "5개", "6개", "7개"], ans: 3, h: "d < r 조건을 이용하면 |k| < 2√2 가 됩니다. √8은 약 2.8입니다." },
            { level: 'hard', levelText: '난이도 상', q: "점 (0, 5)에서 원 x² + y² = 5 에 그은 접선 중 기울기가 양수인 접선의 방정식은?", opts: ["y = x + 5", "y = 2x + 5", "y = 3x + 5", "y = 0.5x + 5", "y = √5x + 5"], ans: 2, h: "기울기를 m으로 두고 mx - y + 5 = 0 과 중심 사이의 거리가 √5 임을 이용해 m을 구하세요." }
        ];

        const container = document.getElementById('quiz-list');
        const circleNums = ['①', '②', '③', '④', '⑤'];
        let userAnswers = {};

        quizzes.forEach((quiz, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-card-${index}`;
            
            let optionsHtml = '';
            quiz.opts.forEach((opt, oIndex) => {
                optionsHtml += `<div class="option" id="opt-${index}-${oIndex}" onclick="selectOption(${index}, ${oIndex})">${circleNums[oIndex]} ${opt}</div>`;
            });

            card.innerHTML = `
                <div class="level ${quiz.level}">${quiz.levelText}</div>
                <div class="question">Q${index + 1}. ${quiz.q}</div>
                <div class="options" id="options-${index}">
                    ${optionsHtml}
                </div>
                <button class="check-btn" onclick="checkAnswer(${index})">정답 확인</button>
                <div class="answer-box" id="answer-${index}"></div>
            `;
            container.appendChild(card);
        });

        function selectOption(qIndex, oIndex) {
            userAnswers[qIndex] = oIndex + 1; // 1-based index
            const options = document.querySelectorAll(`#options-${qIndex} .option`);
            options.forEach(opt => opt.classList.remove('selected'));
            document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
        }

        function checkAnswer(qIndex) {
            const selected = userAnswers[qIndex];
            const ansBox = document.getElementById(`answer-${qIndex}`);
            const quiz = quizzes[qIndex];

            if (!selected) {
                alert("보기를 먼저 선택해주세요!");
                return;
            }

            ansBox.style.display = 'block';
            if (selected === quiz.ans) {
                ansBox.innerHTML = `
                    <div class="result-msg correct">🎉 정답입니다! (정답: ${quiz.ans}번)</div>
                    ${quiz.h ? `<div class="hint">💡 해설 포인트: ${quiz.h}</div>` : ''}
                `;
            } else {
                ansBox.innerHTML = `
                    <div class="result-msg wrong">❌ 아쉽네요. 다시 생각해보세요.</div>
                    <div style="font-weight:bold; margin-top:5px;">정답은 ${quiz.ans}번 입니다.</div>
                    ${quiz.h ? `<div class="hint">💡 힌트: ${quiz.h}</div>` : ''}
                `;
            }
        }
    </script>
</body>
</html>
