<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인창고 공통수학2 - 원의 방정식 퀴즈</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .quiz-container { max-width: 600px; margin: 0 auto; }
        .quiz-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .level { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px; color: white; }
        .easy { background-color: #27ae60; }
        .medium { background-color: #f39c12; }
        .hard { background-color: #e74c3c; }
        .question { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .answer { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; color: #2980b9; font-weight: bold; }
        .hint { font-size: 13px; color: #7f8c8d; font-weight: normal; margin-top: 5px; }
        button { background-color: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>🎯 원의 방정식 핵심 퀴즈 20선</h1>
    <p style="text-align: center;">문제를 풀어보고 '정답 보기' 버튼을 눌러 확인해봐!</p>

    <div class="quiz-container" id="quiz-list">
        <!-- 자바스크립트로 문제가 여기에 들어갑니다 -->
    </div>

    <script>
        const quizzes = [
            { level: 'easy', levelText: '난이도 하', q: "원의 정의는 '평면 위의 한 정점으로부터 [ ? ] 거리에 있는 점들의 집합'이다.", a: "같은", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (2, -3)이고 반지름이 4인 원의 방정식을 구하시오.", a: "(x - 2)² + (y + 3)² = 16", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "중심이 원점 (0, 0)이고 반지름이 5인 원의 방정식을 구하시오.", a: "x² + y² = 25", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² + 4x - 2y - 4 = 0 의 중심의 좌표를 구하시오.", a: "(-2, 1)", h: "일반형을 표준형으로 변형해봐요." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² - 6x + 8y = 0 의 반지름을 구하시오.", a: "5", h: "(x - 3)² + (y + 4)² = 25 로 묶어보세요." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (3, 4)이고 x축에 접하는 원의 방정식을 구하시오.", a: "(x - 3)² + (y - 4)² = 16", h: "x축에 접하면 반지름 r = |y좌표| 예요." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (-2, 5)이고 y축에 접하는 원의 방정식을 구하시오.", a: "(x + 2)² + (y - 5)² = 4", h: "y축에 접하면 반지름 r = |x좌표| 예요." },
            { level: 'easy', levelText: '난이도 하', q: "중심이 (3, 3)이고 x축과 y축에 동시에 접하는 원의 방정식을 구하시오.", a: "(x - 3)² + (y - 3)² = 9", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² = 25 위의 점 (3, 4)에서의 접선의 방정식을 구하시오.", a: "3x + 4y = 25", h: "x₁x + y₁y = r² 공식을 바로 써보세요." },
            { level: 'easy', levelText: '난이도 하', q: "원 x² + y² = 9 에 접하고 기울기가 2인 접선의 방정식을 구하시오.", a: "y = 2x ± 3√5", h: "y = mx ± r√(m² + 1) 공식을 사용하세요." },
            { level: 'easy', levelText: '난이도 하', q: "원 중심과 직선 사이 거리를 d, 반지름을 r이라 할 때, d = r 이면 몇 개의 점에서 만나는가?", a: "1개 (접한다)", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "d < r 일 때, 원과 직선의 교점의 개수는?", a: "2개", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "판별식 D < 0 일 때, 원과 직선의 교점의 개수는?", a: "0개 (만나지 않는다)", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "일반형 x² + y² + Ax + By + C = 0 이 원이 되기 위한 조건식은?", a: "A² + B² - 4C > 0", h: "" },
            { level: 'easy', levelText: '난이도 하', q: "원 (x-1)² + (y-2)² = 9 와 중심이 같고, 원점(0, 0)을 지나는 원의 방정식은?", a: "(x - 1)² + (y - 2)² = 5", h: "중심 (1, 2)와 (0,0) 사이의 거리가 곧 반지름이에요." },
            { level: 'medium', levelText: '난이도 중', q: "방정식 x² + y² + 2x - 4y + k = 0 이 원이 되기 위한 k의 범위를 구하시오.", a: "k < 5", h: "A² + B² - 4C > 0 공식에 대입하세요." },
            { level: 'medium', levelText: '난이도 중', q: "원 (x-1)² + (y-2)² = 5 와 직선 y = 2x + k 가 접할 때, 양수 k의 값을 구하시오.", a: "k = 5", h: "중심과 직선 2x - y + k = 0 사이의 거리가 반경(√5)과 같아요 (d=r)." },
            { level: 'medium', levelText: '난이도 중', q: "점 (-1, 2)를 지나고 x축, y축에 동시 접하는 원의 반지름 2개를 구하시오.", a: "1 또는 5", h: "제2사분면 중심이므로 (-r, r)로 두고 대입해서 r에 대한 2차 방정식을 푸세요." },
            { level: 'hard', levelText: '난이도 상', q: "원 x² + y² = 4 와 직선 y = x + k 가 서로 다른 두 점에서 만나도록 하는 k의 범위를 구하시오.", a: "-2√2 < k < 2√2", h: "d < r 조건을 부등식으로 푸세요. (거리 d에는 절대값이 들어갑니다)" },
            { level: 'hard', levelText: '난이도 상', q: "점 (0, 5)에서 원 x² + y² = 5 에 그은 접선 중 기울기가 양수인 것을 구하시오.", a: "y = 2x + 5", h: "기울기를 m으로 두고 mx - y + 5 = 0 과 중심(0,0) 사이의 거리가 √5 임을 이용해 m을 구하세요." }
        ];

        const container = document.getElementById('quiz-list');

        quizzes.forEach((quiz, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            
            card.innerHTML = `
                <div class="level ${quiz.level}">${quiz.levelText}</div>
                <div class="question">Q${index + 1}. ${quiz.q}</div>
                <button onclick="toggleAnswer(${index})">정답 보기</button>
                <div class="answer" id="answer-${index}">
                    정답: ${quiz.a}
                    ${quiz.h ? `<div class="hint">💡 힌트: ${quiz.h}</div>` : ''}
                </div>
            `;
            container.appendChild(card);
        });

        function toggleAnswer(index) {
            const ansDiv = document.getElementById(`answer-${index}`);
            if (ansDiv.style.display === 'block') {
                ansDiv.style.display = 'none';
            } else {
                ansDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
